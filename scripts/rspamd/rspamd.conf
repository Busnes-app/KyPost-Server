# Operator-local scan only. Use selected upstream checks, not upstream remote
# fuzzy/update/export/AI services or a controller with default credentials.
lua = "/usr/share/rspamd/rules/rspamd.lua";
.include "/usr/share/rspamd/config/groups.conf"
.include "/usr/share/rspamd/config/composites.conf"
modules {
    path = "/usr/share/rspamd/plugins";
}
.include "/usr/share/rspamd/config/modules.d/chartable.conf"
.include "/usr/share/rspamd/config/modules.d/dkim.conf"
.include "/usr/share/rspamd/config/modules.d/regexp.conf"
.include "/usr/share/rspamd/config/modules.d/spf.conf"
.include "/usr/share/rspamd/config/modules.d/dmarc.conf"
mime_types { file = "/usr/share/rspamd/config/maps.d/mime_types.inc"; }
.include "/usr/share/rspamd/config/modules.d/hfilter.conf"
mid { source { url = "/usr/share/rspamd/config/maps.d/mid.inc"; } }
.include "/usr/share/rspamd/config/modules.d/maillist.conf"
.include "/usr/share/rspamd/config/modules.d/once_received.conf"
options {
    filters = "chartable,dkim,regexp";
    cache_file = "/var/lib/rspamd/symbols.cache";
    tempdir = "/tmp";
    url_tld = "/usr/share/rspamd/effective_tld_names.dat";
    dns { timeout = 1s; retransmits = 2; }
    task_timeout = 5s;
}
actions {
    reject = 15;
    add_header = 6;
    greylist = null;
}
# Keep correspondence, rule parameters and raw provider diagnostics out of logs.
# KyPost emits only bounded scan outcomes with its transaction correlation ID.
logging { type = "file"; filename = "/dev/null"; level = "error"; }
worker "normal" {
    bind_socket = "127.0.0.1:11333";
    count = 1;
    mime = true;
}
