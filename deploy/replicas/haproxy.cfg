# HAProxy for docker-compose.replicas.yml: active readiness checks per replica found through
# Docker's DNS, round robin, and retries only where a request cannot have run twice. The
# server timeouts are docs/RUNNING.md's proxy-timeout table: each route's own budget plus
# headroom; check-replicas-compose.py keeps them in step.
global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 17m
    # Ordinary requests end at 14 s (KyPost answers 503 at its own deadline); 15 s lets that
    # answer through instead of a proxy 504.
    timeout server 15s
    timeout http-request 15s
    timeout check 1s
    # A request that never reached a replica (refused connection) may go to another one; an
    # empty response (a replica that died mid-request) is retried for GET/HEAD only, below,
    # so a POST is never sent twice. A timed-out request is never retried: it would wait again.
    retries 2
    option redispatch 1
    retry-on conn-failure empty-response

resolvers docker
    nameserver docker 127.0.0.11:53
    accepted_payload_size 8192
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold other 2s
    hold refused 2s
    hold nx 2s
    hold timeout 2s
    hold obsolete 2s

frontend web
    bind :5866
    # Only the edge proxy (KYPOST_EDGE_TRUSTED_PROXY; unset, an address nothing connects
    # from) may say who the client is or which scheme it used. From anyone else these are
    # dropped, so a direct caller cannot pick the address its lockouts are keyed by.
    acl from_edge src "${KYPOST_EDGE_TRUSTED_PROXY}"
    http-request del-header X-Forwarded-For unless from_edge
    http-request del-header CF-Connecting-IP unless from_edge
    http-request del-header X-Forwarded-Proto unless from_edge
    default_backend replicas

backend replicas
    balance roundrobin
    # The replicas trust this proxy and the edge (TRUSTED_PROXY_CIDRS) and walk the chain past
    # both: it appends the peer it saw, after any edge's value.
    option forwardfor
    http-request disable-l7-retry unless METH_GET || METH_HEAD
    # Long routes keep their budgets (KyPost's longRoutes): proxy timeout = budget + headroom.
    http-request set-timeout server 17m if { path_beg /api/admin/backup/ }
    http-request set-timeout server 11m if { path_beg /api/export /api/contacts/export /api/mail/ /api/inbox /api/rules/run /api/import }
    http-request set-timeout server 3m if { path_beg /api/imap/ /api/contacts/carddav-client/ /api/contacts/import /api/kydrive/ /api/pgp/pickup /api/admin/native-recovery/ /api/admin/mail/poll-now /mcp }
    http-request set-timeout server 2m if { path_beg /api/admin/mail-relay /api/admin/mail-domain /api/admin/mail-domains /dav/ }
    http-request set-timeout server 3m if { path_reg ^/api/contacts/[^/]+/photo$ }
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    default-server check inter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr none
    # One slot per replica of the kypost-server service (KYPOST_REPLICAS), filled as Docker's
    # DNS changes.
    server-template app "${KYPOST_REPLICAS}" kypost-server:5866
