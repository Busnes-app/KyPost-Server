# Maddy profile: add after docker-compose.receiving.yml. Cloudflare profile: add
# directly after docker-compose.yml, never with the receiving overlay.
# No scanner/admin port is published.
# Refused together with docker-compose.replicas.yml, whose KYPOST_PROXY_IP is then set.
x-single-container: ${KYPOST_PROXY_IP:+${KYPOST_RSPAMD_WITH_REPLICAS:?docker-compose.rspamd.yml shares one container's network and runs only in the single-container profile; remove docker-compose.replicas.yml or this overlay}}
services:
  kypost-server:
    environment:
      KYPOST_RECEIVING_RSPAMD: "true"
  rspamd:
    image: rspamd/rspamd:4.3.0@sha256:0d89891908f93ab1ce53c17fa90430130b48ad720216192ec44e646997c0a8e1
    # Loopback scan channel; scanner has no KyPost files or credentials.
    network_mode: service:kypost-server
    user: "11333:11333"
    entrypoint: ["rspamd"]
    command: ["-f", "-c", "/etc/rspamd/rspamd.conf"]
    volumes:
      - type: bind
        source: ./scripts/rspamd/rspamd.conf
        target: /etc/rspamd/rspamd.conf
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=11333,gid=11333,mode=0700
      - /var/lib/rspamd:rw,noexec,nosuid,size=32m,uid=11333,gid=11333,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    depends_on:
      kypost-server:
        condition: service_started
        restart: true
    healthcheck:
      test: ["CMD", "rspamc", "-h", "127.0.0.1:11333", "-t", "2", "-E"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 15s
