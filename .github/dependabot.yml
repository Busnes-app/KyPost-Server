version: 2

# SHA-pinned actions do not update themselves, and a pin nobody advances is a
# frozen dependency rather than a safe one. This is the counterpart to the
# pinning in ci.yml and ollama-bump.yml: Dependabot proposes the new SHA, CI
# proves the workflow still works, a human merges it.
#
# Note that these PRs need the same repository setting the ollama-bump workflow
# needs — Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests" — or they are silently never opened.
#
# Every ecosystem is grouped. The first run of this file without grouping
# opened ten at once (the whole accumulated backlog of a repo that had never
# run Dependabot), each triggering a full matrix including a `docker build`.
#
# Majors are deliberately grouped in alongside minors rather than ignored.
# Every update in that first batch was a major — vite 5->8, react-router 6->7,
# @vitejs/plugin-react 4->6, jsdom 29->30, checkout 4->7 — so a config that
# skipped majors would have filtered out all of the actual work while still
# claiming coverage. They arrive together and get reviewed on purpose.
#
# Three days of cooldown on every ecosystem: a version that has been out for
# three days has had three days for someone else to find the yanked release.
# Cooldown applies to version updates only — a security update still arrives
# the day it is published.
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      ky-primitives:
        patterns: ["github.com/Busnes-app/ky-primitives*"]
      go:
        patterns: ["*"]
        exclude-patterns: ["github.com/Busnes-app/ky-primitives*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      # Split by what a break would mean. A runtime bump (dompurify, openpgp,
      # quill, react) can ship a vulnerability to a browser parsing hostile
      # mail; a build-tooling bump can only break the build, which CI catches
      # before anyone sees it. Separating them means the urgent one is never
      # stuck behind a vite major that needs a migration.
      npm-build:
        dependency-type: development
      npm-runtime:
        dependency-type: production
    # quill 2.0.3 is the whole affected range of GHSA-v3m3-f69x-jf25 (XSS via
    # the HTML export feature) and the advisory has no first_patched_version --
    # 2.0.3 is the newest release, so "upgrade to the fix" is not yet an option
    # and 2.0.2 is the safe version. Dependabot proposed the bump anyway (#77),
    # because it tracks releases, not advisories against them. The runtime
    # audit gate in ci.yml runs at --audit-level=low precisely so this cannot
    # be merged, but a PR that can only ever fail CI gets re-opened every week
    # and trains people to ignore a red frontend job.
    #
    # Pinned to the single bad version, not the minor: 2.0.4 is how this gets
    # fixed and must still be proposed the day it lands. Delete this entry
    # then -- and the paragraph in ci.yml that explains the audit level with
    # this advisory as its example.
    ignore:
      - dependency-name: "quill"
        versions: ["2.0.3"]
    commit-message:
      prefix: "chore(deps)"

  # Relay Workers: build tooling only (wrangler, typescript, workers-types).
  # receiving-worker/ and push-relay-shared/ have no package.json.
  - package-ecosystem: npm
    directories: ["/worker", "/worker-apns"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      relay:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  # CI tools, pinned in their own module so their dependency tree never moves the
  # app's. Go records a tool directive's module as `// indirect`, which Dependabot
  # skips by default, so each tool is allowed by name.
  - package-ecosystem: gomod
    directory: /tools
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    allow:
      - dependency-name: "github.com/golangci/golangci-lint/v2"
        dependency-type: "all"
      - dependency-name: "golang.org/x/vuln"
        dependency-type: "all"
      - dependency-name: "golang.org/x/tools"
        dependency-type: "all"
    groups:
      tools:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # ESLint toolchain, separate because typescript-eslint needs TypeScript 6.
  - package-ecosystem: npm
    directory: /frontend/lint
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-lint:
        patterns: ["*"]
    # typescript-eslint peers on typescript <6.1.0, so any newer typescript
    # here fails `npm ci` (#383). Delete once a typescript-eslint bump here
    # widens that peer range.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"

  # A golang or node bump here fails ci-scripts until backend/go.mod's
  # toolchain line or frontend/.nvmrc (+ package.json engines) is pushed to
  # the same PR; the failure names the file.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"

  # Pinned images in the optional compose files (rspamd).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
